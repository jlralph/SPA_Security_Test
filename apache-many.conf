# ── Users API  :3003 ──────────────────────────────────────────────────────────
# Serves:
#   GET    /api/users      → api-static/users.json
#   GET    /api/users/:id  → api-static/users/:id.json
#   DELETE /api/users/:id  → 204 No Content  (state not mutated — static demo)

Listen 3003

<VirtualHost *:3003>
    ServerName localhost

    DocumentRoot "E:/Storage/SPA_Security_Test/api-static"
    <Directory "E:/Storage/SPA_Security_Test/api-static">
        Options -Indexes
        AllowOverride None
        Require all granted
        AddType application/json .json
    </Directory>

    Header always set Cache-Control                "no-store"
    Header always set Pragma                       "no-cache"
    Header always set Access-Control-Allow-Origin  "http://localhost:4200"
    Header always set Access-Control-Allow-Methods "GET, DELETE, OPTIONS"
    Header always set Access-Control-Allow-Headers "Authorization, Content-Type"
    Header always set Access-Control-Max-Age       "86400"

    RewriteEngine On

    RewriteCond %{REQUEST_METHOD} =OPTIONS
    RewriteRule ^ - [R=204,L]

    RewriteCond %{REQUEST_URI} !^/api/users
    RewriteRule ^ - [R=403,L]

    # DELETE → 204 (no body)
    RewriteCond %{REQUEST_METHOD} DELETE
    RewriteRule ^ - [R=204,L]

    # GET /api/users/:id
    RewriteRule ^/api/users/([0-9]+)$ /users/$1.json [L]

    # GET /api/users
    RewriteRule ^/api/users$ /users.json [L]

    # forensic log to capture all details of requests for security analysis
    ForensicLog "logs/spa-security-users-service-forensic.log"

    # Add Host and X-Forwarded-Host Headers to the Host Access Log.
    LogFormat "%h %l %u %t \"%r\" %>s %b \"Host:localhost:3003\" \"X-Forwarded-Host:%{X-Forwarded-Host}i\"" hostlog
    CustomLog "logs/spa-security-users-service-host-audit.log" hostlog
 
    # Capture the errors and combined access logs separately for security analysis, so they can be monitored and analyzed without noise from other vhosts or the default Apache logs.
    ErrorLog  "logs/spa-security-users-service-error.log"
    CustomLog "logs/spa-security-users-service-access.log" combined
</VirtualHost>

# ── Items API  :3004 ──────────────────────────────────────────────────────────
# Serves:
#   GET    /api/items      → api-static/items.json
#   GET    /api/items/:id  → api-static/items/:id.json
#   POST   /api/items      → api-static/items/created.json  (fixed stub response)
#   DELETE /api/items/:id  → 204 No Content  (state not mutated — static demo)

Listen 3004

<VirtualHost *:3004>
    ServerName localhost

    DocumentRoot "E:/Storage/SPA_Security_Test/api-static"
    <Directory "E:/Storage/SPA_Security_Test/api-static">
        Options -Indexes
        AllowOverride None
        Require all granted
        AddType application/json .json
    </Directory>

    Header always set Cache-Control                "no-store"
    Header always set Pragma                       "no-cache"
    Header always set Access-Control-Allow-Origin  "http://localhost:4200"
    Header always set Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS"
    Header always set Access-Control-Allow-Headers "Authorization, Content-Type"
    Header always set Access-Control-Max-Age       "86400"

    RewriteEngine On

    RewriteCond %{REQUEST_METHOD} =OPTIONS
    RewriteRule ^ - [R=204,L]

    RewriteCond %{REQUEST_URI} !^/api/items
    RewriteRule ^ - [R=403,L]

    # DELETE → 204 (no body)
    RewriteCond %{REQUEST_METHOD} DELETE
    RewriteRule ^ - [R=204,L]

    # POST → stub created response
    RewriteCond %{REQUEST_METHOD} POST
    RewriteRule ^/api/items$ /items/created.json [L]

    # GET /api/items/:id
    RewriteRule ^/api/items/([0-9]+)$ /items/$1.json [L]

    # GET /api/items
    RewriteRule ^/api/items$ /items.json [L]
    # forensic log to capture all details of requests for security analysis
    ForensicLog "logs/spa-security-items-service-forensic.log"

    # Add Host and X-Forwarded-Host Headers to the Host Access Log.
    LogFormat "%h %l %u %t \"%r\" %>s %b \"Host:localhost:3004\" \"X-Forwarded-Host:%{X-Forwarded-Host}i\"" hostlog
    CustomLog "logs/spa-security-items-service-host-audit.log" hostlog
 
    # Capture the errors and combined access logs separately for security analysis, so they can be monitored and analyzed without noise from other vhosts or the default Apache logs.
    ErrorLog  "logs/spa-security-items-service-error.log"
    CustomLog "logs/spa-security-items-service-access.log" combined
</VirtualHost>
