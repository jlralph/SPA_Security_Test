# Apache config — apache-many: each API resource group has its own VirtualHost.
# Apache serves BOTH the frontend (static Angular files) and the backend
# (static JSON fixtures in api-static/).  No Node.js process is required.
#
# Architecture:
#   :4200  Angular SPA  (frontend/dist/frontend/browser/)
#   :3001  Auth API     — POST /api/auth/login
#   :3002  Profile API  — GET  /api/profile
#   :3003  Users API    — GET/DELETE /api/users/*
#   :3004  Items API    — GET/POST/DELETE /api/items/*
#
# Required Apache modules (uncomment in httpd.conf):
#   LoadModule rewrite_module  modules/mod_rewrite.so
#   LoadModule headers_module  modules/mod_headers.so
#
# Replace any apache.conf Include in httpd.conf with:
#   Include "E:/Storage/SPA_Security_Test/apache-many.conf"
#
# Build the Angular app first, then restart Apache — no backend process needed:
#   cd frontend && npm run build
#   E:\Apache24\bin\httpd.exe -k restart

# ── Shared macro: CORS + preflight ───────────────────────────────────────────
# Each API VirtualHost sets its own Allow-Methods then includes these rules.

# ── Frontend  :4200 ───────────────────────────────────────────────────────────

Listen 4200

<VirtualHost *:4200>
    ServerName catch-all.invalid
    RewriteEngine On
    RewriteRule ^ - [R=403,L]
</VirtualHost>

<VirtualHost *:4200>
    ServerName localhost

    # Remove headers that override Host resolution
    RequestHeader unset X-Forwarded-Host
    RequestHeader unset X-Original-Host
    RequestHeader unset X-Forwarded-Server
    RequestHeader unset X-Host
    RequestHeader unset X-Rewrite-URL
    
    # If you proxy to a backend API, set X-Forwarded-Host yourself
    # from your known ServerName, not from the client request
    #RequestHeader set X-Forwarded-Host "www.yourdomain.com" env=!no_forward
    RequestHeader set X-Forwarded-Host "localhost" env=!no_forward

    DocumentRoot "E:/Storage/SPA_Security_Test/frontend/dist/frontend/browser"
    <Directory "E:/Storage/SPA_Security_Test/frontend/dist/frontend/browser">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    RewriteEngine On
    RewriteCond %{HTTP_HOST} !^(www\.)?localhost(:[0-9]+)?$ [NC]
    RewriteRule ^ - [R=403,L]

    ErrorLog  "logs/spa-frontend-error.log"
    CustomLog "logs/spa-frontend-access.log" combined
</VirtualHost>

# ── Auth API  :3001 ───────────────────────────────────────────────────────────
# Serves: POST /api/auth/login → api-static/auth/login.json
# Note: any credentials are accepted — fixed admin response for testing.

Listen 3001

<VirtualHost *:3001>
    ServerName localhost

    DocumentRoot "E:/Storage/SPA_Security_Test/api-static"
    <Directory "E:/Storage/SPA_Security_Test/api-static">
        Options -Indexes
        AllowOverride None
        Require all granted
        AddType application/json .json
    </Directory>

    Header always set Cache-Control                "no-store"
    Header always set Pragma                       "no-cache"
    Header always set Access-Control-Allow-Origin  "http://localhost:4200"
    Header always set Access-Control-Allow-Methods "POST, OPTIONS"
    Header always set Access-Control-Allow-Headers "Authorization, Content-Type"
    Header always set Access-Control-Max-Age       "86400"

    RewriteEngine On

    # Absorb CORS preflight
    RewriteCond %{REQUEST_METHOD} =OPTIONS
    RewriteRule ^ - [R=204,L]

    # Block anything outside /api/auth/
    RewriteCond %{REQUEST_URI} !^/api/auth/
    RewriteRule ^ - [R=403,L]

    # Route login → static fixture
    RewriteRule ^/api/auth/login$ /auth/login.json [L]

    # forensic log to capture all details of requests for security analysis
    ForensicLog "logs/spa-security-auth-service-forensic.log"

    # Add Host and X-Forwarded-Host Headers to the Host Access Log.
    LogFormat "%h %l %u %t \"%r\" %>s %b \"Host:localhost:3001\" \"X-Forwarded-Host:%{X-Forwarded-Host}i\"" hostlog
    CustomLog "logs/spa-security-auth-service-host-audit.log" hostlog
 
    # Capture the errors and combined access logs separately for security analysis, so they can be monitored and analyzed without noise from other vhosts or the default Apache logs.
    ErrorLog  "logs/spa-security-auth-service-error.log"
    CustomLog "logs/spa-security-auth-service-access.log" combined

</VirtualHost>

