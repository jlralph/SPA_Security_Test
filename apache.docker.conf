# Apache config for the Docker build of the frontend.
# Mirrors apache.conf but uses container-relative paths and proxies
# /api → webapp-backend:3000 (the backend service in docker-compose).
# Listen 4200 is set in httpd.conf (replacing the default Listen 80).

# Catch-all VirtualHost — must be the first one so Apache uses it as the
# default when no ServerName/ServerAlias matches. Rejects unknown Host headers.
<VirtualHost *:4200>
    ServerName catch-all.invalid
    RewriteEngine On
    RewriteRule ^ - [R=403,L]
</VirtualHost>

<VirtualHost *:4200>
    ServerName localhost

    # Strip client-supplied headers that try to override Host resolution
    RequestHeader unset X-Forwarded-Host
    RequestHeader unset X-Original-Host
    RequestHeader unset X-Forwarded-Server
    RequestHeader unset X-Host
    RequestHeader unset X-Rewrite-URL
    RequestHeader set X-Forwarded-Host "localhost" env=!no_forward

    # ── Static Angular files (built in stage 1, copied to htdocs) ──────────
    DocumentRoot "/usr/local/apache2/htdocs"
    <Directory "/usr/local/apache2/htdocs">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # Angular HTML5 routing fallback
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    # ── /api → Express backend container ───────────────────────────────────
    RewriteEngine On
    RewriteCond %{HTTP_HOST} !^(www\.)?localhost(:[0-9]+)?$ [NC]
    RewriteRule ^ - [R=403,L]

    ProxyPass        /api/ http://webapp-backend:3000/api/
    ProxyPassReverse /api/ http://webapp-backend:3000/api/
    ProxyPreserveHost Off

    # ── Logs (written to /usr/local/apache2/logs/ inside the container) ────
    ForensicLog "logs/spa-security-forensic.log"

    LogFormat "%h %l %u %t \"%r\" %>s %b \"Host:%{Host}i\" \"X-Forwarded-Host:%{X-Forwarded-Host}i\"" hostlog
    CustomLog "logs/spa-security-host-audit.log" hostlog

    ErrorLog  "logs/spa-security-error.log"
    CustomLog "logs/spa-security-access.log" combined
</VirtualHost>
