networks:
  oast-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

services:
  # OAST interaction server
  oast-server:
    build:
      context: ./oast/server
      dockerfile: Dockerfile
    container_name: oast-server
    restart: unless-stopped
    environment:
      OAST_IP: "172.30.0.10"
      OAST_DOMAIN: "oast.local"
      UPSTREAM_DNS: "8.8.8.8"
    ports:
      - "8082:8080"   # Web UI
    networks:
      oast-net:
        ipv4_address: 172.30.0.10

  # Logging proxy — HTTP traffic logged to stdout (docker compose logs -f proxy)
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: proxy
    restart: unless-stopped
    ports:
      - "8080:8080"
    dns:
      - 172.30.0.10
    networks:
      - oast-net

  # Express backend
  webapp-backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: webapp-backend
    restart: unless-stopped
    depends_on:
      - oast-server
      - proxy
    environment:
      PORT: "3000"
      JWT_SECRET: "oast-local-test-secret-change-me"
      HTTP_PROXY: "http://proxy:8080"
      HTTPS_PROXY: "http://proxy:8080"
    #  NO_PROXY: "localhost,127.0.0.1"
    ports:
      - "3000:3000"
    dns:
      - 172.30.0.10
    networks:
      - oast-net

  # OWASP ZAP — daemon mode
  # UI:  http://localhost:8090/UI/
  #
  # CLI scans — run as a one-off container (scan scripts manage their own ZAP lifecycle):
  #   docker compose run --rm zap zap-baseline.py -t http://webapp-frontend:4200 -r baseline.html
  #   docker compose run --rm zap zap-full-scan.py  -t http://webapp-frontend:4200 -r full.html
  #   docker compose run --rm zap zap-api-scan.py   -t http://webapp-backend:3000/openapi.json -f openapi -r api.html
  # Reports land in ./reports/ on the host.
  #
  # Daemon-based scanning (no extra container) via the REST API:
  #   curl "http://localhost:8090/JSON/spider/action/scan/?url=http://webapp-frontend:4200"
  #   curl "http://localhost:8090/JSON/ascan/action/scan/?url=http://webapp-frontend:4200&recurse=true"
  #   curl "http://localhost:8090/OTHER/core/other/htmlreport/" > reports/zap-report.html
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: zap
    user: zap
    command: >
      zap.sh -daemon
      -host 0.0.0.0
      -port 8090
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
      -config api.disablekey=true
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./reports:/zap/wrk:rw
    dns:
      - 172.30.0.10
    networks:
      - oast-net

  # Angular frontend (nginx)
  webapp-frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: webapp-frontend
    restart: unless-stopped
    depends_on:
      - webapp-backend
      - proxy
    environment:
      PORT: "4200"
      HTTP_PROXY: "http://proxy:8080"
      HTTPS_PROXY: "http://proxy:8080"
    ports:
      - "4200:4200"
    networks:
      - oast-net

