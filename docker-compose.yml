networks:
  oast-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

services:
  # OAST interaction server
  oast-server:
    build:
      context: ./oast/server
      dockerfile: Dockerfile
    container_name: oast-server
    restart: unless-stopped
    environment:
      OAST_IP: "172.30.0.10"
      OAST_DOMAIN: "oast.local"
      UPSTREAM_DNS: "8.8.8.8"
    ports:
      - "8082:8080"   # Web UI
    networks:
      oast-net:
        ipv4_address: 172.30.0.10

  # Intercepting proxy (mitmweb UI at :8081, proxy at :8080)
  mitmproxy:
    image: mitmproxy/mitmproxy
    container_name: mitmproxy
    command: mitmweb --web-host 0.0.0.0
    restart: unless-stopped
    ports:
      - "8080:8080"   # proxy listener
      - "8081:8081"   # mitmweb UI
    networks:
      - oast-net
    environment:
      - PYTHONUNBUFFERED=1

  # Express backend
  webapp-backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: webapp-backend
    restart: unless-stopped
    depends_on:
      - oast-server
      - mitmproxy
    environment:
      PORT: "3000"
      JWT_SECRET: "oast-local-test-secret-change-me"
      HTTP_PROXY: "http://mitmproxy:8080"
      HTTPS_PROXY: "http://mitmproxy:8080"
    #  NO_PROXY: "localhost,127.0.0.1"
    ports:
      - "3000:3000"
    dns:
      - 172.30.0.10
    networks:
      - oast-net

  # Angular frontend (nginx)
  webapp-frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: webapp-frontend
    restart: unless-stopped
    depends_on:
      - webapp-backend
      - mitmproxy
    environment:
      PORT: "4200"
      HTTP_PROXY: "http://mitmproxy:8080"
      HTTPS_PROXY: "http://mitmproxy:8080"
    ports:
      - "4200:4200"
    networks:
      - oast-net
