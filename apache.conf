# Apache config — serves the built Angular SPA and proxies /api to the Node backend.
#
# Required Apache modules:
#   LoadModule rewrite_module   modules/mod_rewrite.so
#   LoadModule proxy_module     modules/mod_proxy.so
#   LoadModule proxy_http_module modules/mod_proxy_http.so
#
# Setup (XAMPP on Windows):
#   1. Enable the three modules above in httpd.conf (uncomment LoadModule lines).
#   2. Add to httpd.conf:
#        Listen 4200
#        Include "E:/Storage/SPA_Security_Test/apache.conf"
#      (adjust the drive/path to match your machine)
#   3. Build the Angular app first:
#        cd frontend && npm run build
#   4. Start (or restart) Apache, then start the Node backend:
#        npm run dev:backend
#   5. Open http://localhost:4200
#
# Linux / macOS:
#   Symlink or Include this file from /etc/apache2/sites-enabled/ or
#   /etc/httpd/conf.d/, then:  sudo apachectl restart

Listen 4200

# This MUST be the first VirtualHost in your config (Apache uses the first
# VirtualHost as the default when no ServerName/ServerAlias matches)
<VirtualHost *:4200>
    ServerName catch-all.invalid
    # Reject everything that doesn't match a known vhost
    RewriteEngine On
    RewriteRule ^ - [R=403,L]
</VirtualHost>

<VirtualHost *:4200>
    # ------------------------------------------------------------------
    # Static Angular files
    # Built output from:  cd frontend && npm run build
    # Adjust DocumentRoot if your machine path differs.
    # ------------------------------------------------------------------
    ServerName localhost
    
    # Remove headers that override Host resolution
    RequestHeader unset X-Forwarded-Host
    RequestHeader unset X-Original-Host
    RequestHeader unset X-Forwarded-Server
    RequestHeader unset X-Host
    RequestHeader unset X-Rewrite-URL
    
    # If you proxy to a backend API, set X-Forwarded-Host yourself
    # from your known ServerName, not from the client request
    #RequestHeader set X-Forwarded-Host "www.yourdomain.com" env=!no_forward
    RequestHeader set X-Forwarded-Host "localhost" env=!no_forward
    
    DocumentRoot "E:/Storage/SPA_Security_Test/frontend/dist/frontend/browser"
    <Directory "E:/Storage/SPA_Security_Test/frontend/dist/frontend/browser">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # Angular uses the HTML5 History API for routing.
        # Any path that is not a real file must fall back to index.html.
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    # ------------------------------------------------------------------
    # API proxy → Node / Express backend on port 3000
    # ------------------------------------------------------------------
    # Only allow requests with a recognized Host header to reach the proxy
    RewriteEngine On
#    RewriteCond %{HTTP_HOST} !^(www\.)?yourdomain\.com$ [NC]
#    RewriteCond %{HTTP_HOST} !^api\.yourdomain\.com$ [NC]
#    RewriteRule ^ - [R=403,L]
 
    RewriteCond %{HTTP_HOST} !^(www\.)?localhost(:[0-9]+)?$ [NC]
    RewriteRule ^ - [R=403,L]

    # Then proxy
    ProxyPass /api/ http://localhost:3000/api/
    ProxyPassReverse /api/ http://localhost:3000/api/
    ProxyPreserveHost Off

    # forensic log to capture all details of requests for security analysis
    ForensicLog "logs/spa-security-forensic.log"

    # Add Host and X-Forwarded-Host Headers to the Host Access Log.
    LogFormat "%h %l %u %t \"%r\" %>s %b \"Host:%{Host}i\" \"X-Forwarded-Host:%{X-Forwarded-Host}i\"" hostlog
    CustomLog "logs/spa-security-host-audit.log" hostlog
 
    # Capture the errors and combined access logs separately for security analysis, so they can be monitored and analyzed without noise from other vhosts or the default Apache logs.
    ErrorLog  "logs/spa-security-error.log"
    CustomLog "logs/spa-security-access.log" combined
</VirtualHost>
