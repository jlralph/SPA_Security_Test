# INSECURE Apache config — for demo and security-testing purposes only.
#
# Differences from apache.docker.secure.conf — every one is an intentional
# vulnerability. Do not deploy this anywhere real.
#
#   1. No catch-all VirtualHost — any Host header reaches the main vhost.
#   2. No RequestHeader unset — client-supplied X-Forwarded-Host /
#      X-Original-Host / X-Host / X-Rewrite-URL pass through unchanged.
#   3. No X-Forwarded-Host override — the backend trusts whatever the
#      client sent.
#   4. No Host header validation — requests with arbitrary Host headers
#      are proxied to the backend.
#   5. ProxyPreserveHost On — the client's Host header is forwarded to
#      the Express backend, enabling host-header-based attacks
#      (password-reset poisoning, cache poisoning, SSRF via Host).
#   6. ServerAlias * — accepts requests for any hostname.
#   7. TraceEnable On — TRACE method enabled (XST risk).

TraceEnable On

<VirtualHost *:4200>
    ServerName  localhost
    ServerAlias *

    # ── Static Angular files ───────────────────────────────────────────────
    DocumentRoot "/usr/local/apache2/htdocs"
    <Directory "/usr/local/apache2/htdocs">
        Options +Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Angular HTML5 routing fallback
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    # ── /api → Express backend container (Host header preserved!) ─────────
    ProxyPass        /api/ http://webapp-backend:3000/api/
    ProxyPassReverse /api/ http://webapp-backend:3000/api/
    ProxyPreserveHost On

    # ── Logs ────────────────────────────────────────────────────────────────
    ForensicLog "logs/spa-security-forensic.log"

    LogFormat "%h %l %u %t \"%r\" %>s %b \"Host:%{Host}i\" \"X-Forwarded-Host:%{X-Forwarded-Host}i\"" hostlog
    CustomLog "logs/spa-security-host-audit.log" hostlog

    ErrorLog  "logs/spa-security-error.log"
    CustomLog "logs/spa-security-access.log" combined
</VirtualHost>
