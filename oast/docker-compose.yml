networks:
  oast-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

services:
  oast-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: oast-server
    restart: unless-stopped
    environment:
      OAST_IP: "172.30.0.10"
      OAST_DOMAIN: "oast.local"
      UPSTREAM_DNS: "8.8.8.8"
    ports:
      - "8082:8080"   # Web UI — http://localhost:8082
      # Uncomment to expose DNS on the host (requires admin/root on the host):
      # - "53:53/udp"
      # - "53:53/tcp"
    networks:
      oast-net:
        ipv4_address: 172.30.0.10
