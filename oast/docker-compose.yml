networks:
  oast-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

services:

  # ── OAST interaction server ──────────────────────────────────────────────────
  # DNS: resolves *.oast.local → its own IP, logs every query.
  # HTTP: captures callbacks on :80.
  # Web UI: http://localhost:8080 shows all interactions in real time.
  oast-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: oast-server
    restart: unless-stopped
    environment:
      OAST_IP: "172.28.0.10"
      OAST_DOMAIN: "oast.local"
      UPSTREAM_DNS: "8.8.8.8"
    ports:
      - "8080:8080"   # Web UI — open http://localhost:8080
    networks:
      oast-net:
        ipv4_address: 172.28.0.10

  # ── Express backend ──────────────────────────────────────────────────────────
  # DNS overridden to oast-server so any *.oast.local lookup is captured.
  webapp-backend:
    build:
      context: ..
      dockerfile: oast/backend.Dockerfile
    container_name: webapp-backend
    restart: unless-stopped
    depends_on:
      - oast-server
    environment:
      PORT: "3000"
      JWT_SECRET: "oast-local-test-secret-change-me"
    ports:
      - "3000:3000"   # API — accessible directly at http://localhost:3000
    dns:
      - 172.28.0.10   # all DNS queries from the backend go through oast-server
    networks:
      - oast-net

  # ── Angular frontend (nginx) ─────────────────────────────────────────────────
  # Serves the built SPA and proxies /api/ → webapp-backend:3000.
  webapp-frontend:
    build:
      context: ..
      dockerfile: oast/frontend.Dockerfile
    container_name: webapp-frontend
    restart: unless-stopped
    depends_on:
      - webapp-backend
    ports:
      - "4200:4200"   # SPA — open http://localhost:4200
    networks:
      - oast-net
